<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/FBXLoader.js';

// ---------- কনফিগ ----------
const MAP = 200, SPACING = 40, ROAD_W = 10, PR = 0.45;
const WALK = 4.5, RUN = 11;
const CHAR_HEIGHT = 1.8;
const MODEL_YAW = 0;          // চরিত্র উল্টো দিকে হাঁটলে এটি Math.PI করুন

// ---------- সেটআপ ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb6e0);
scene.fog = new THREE.Fog(0x8fb6e0, 90, 280);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.domElement.id = 'game';
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x6a8a50, 0.75));
const sun = new THREE.DirectionalLight(0xffd9a8, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, far: 300 });
scene.add(sun, sun.target);

// ---------- টেক্সচার (কোড দিয়ে তৈরি) ----------
function noise(g, w, h, colors, count) {
  for (let i = 0; i < count; i++) {
    g.fillStyle = colors[Math.floor(Math.random() * colors.length)];
    g.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
const grassTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#7cc45a'; g.fillRect(0, 0, w, h);
  noise(g, w, h, ['#6fb24f', '#8fd46a', '#68a84a'], 700);
});
grassTex.repeat.set(MAP * 2 / 8, MAP * 2 / 8);

const roadTexH = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#4b5059'; g.fillRect(0, 0, w, h);
  noise(g, w, h, ['#434851', '#555b64'], 300);
  g.fillStyle = '#f2efe6';
  for (let x = 0; x < w; x += 16) g.fillRect(x, h / 2 - 1, 8, 2);
});
roadTexH.repeat.set(MAP * 2 / 8, 1);
const roadTexV = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#4b5059'; g.fillRect(0, 0, w, h);
  noise(g, w, h, ['#434851', '#555b64'], 300);
  g.fillStyle = '#f2efe6';
  for (let y = 0; y < h; y += 16) g.fillRect(w / 2 - 1, y, 2, 8);
});
roadTexV.repeat.set(1, MAP * 2 / 8);

// জানালাওয়ালা দেয়াল (প্রতিটি রঙের জন্য একবার তৈরি)
const facadeCache = {};
function facadeTex(base) {
  if (facadeCache[base]) return facadeCache[base];
  const t = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(0, h - 28, w, 28);
    for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {
      const x = 28 + c * 112, y = 36 + r * 100;
      g.fillStyle = '#2f4558'; g.fillRect(x, y, 72, 64);
      g.fillStyle = '#9fc7e0'; g.fillRect(x + 6, y + 6, 60, 22);
      g.fillStyle = '#ffffff'; g.fillRect(x - 4, y + 64, 80, 6);
    }
  });
  facadeCache[base] = t;
  return t;
}

// ---------- ওয়ার্ল্ড ----------
const boxes = [];
const roadCenters = [];
const blocksList = [], parks = [];
const mctx = document.getElementById('mini').getContext('2d');
const palette = ['#f4e3c1', '#f6c6a8', '#d9e8f5', '#e8f5c8', '#f5d0e0', '#c9d6f0', '#fff3d1', '#e9dccb'];
const awningColors = ['#e74c3c', '#2ecc71', '#3498db', '#f1c40f', '#9b59b6'];
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

const roofMat = new THREE.MeshStandardMaterial({ color: 0x8a8f96, roughness: 0.9 });
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 1 });

function buildWorld() {
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(MAP * 2, MAP * 2),
    new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  for (let i = -5; i <= 5; i++) {
    const p = i * SPACING;
    roadCenters.push(p);
    const h = new THREE.Mesh(
      new THREE.PlaneGeometry(MAP * 2, ROAD_W),
      new THREE.MeshStandardMaterial({ map: roadTexH, roughness: 0.95 })
    );
    h.rotation.x = -Math.PI / 2; h.position.set(0, 0.02, p); h.receiveShadow = true;
    const v = new THREE.Mesh(
      new THREE.PlaneGeometry(ROAD_W, MAP * 2),
      new THREE.MeshStandardMaterial({ map: roadTexV, roughness: 0.95 })
    );
    v.rotation.x = -Math.PI / 2; v.position.set(p, 0.03, 0); v.receiveShadow = true;
    scene.add(h, v);
  }

  for (let kx = -4; kx <= 3; kx++) {
    for (let kz = -4; kz <= 3; kz++) {
      const cx = kx * SPACING + 20, cz = kz * SPACING + 20;
      addSidewalk(cx, cz, (kx + kz) % 3 === 0);

      // পার্ক ব্লক
      if ((kx + kz) % 3 === 0) {
        for (let t = 0; t < 3; t++) {
          addTree(cx + (Math.random() * 20 - 10), cz + (Math.random() * 20 - 10), 1.1);
        }
        parks.push({ x: cx, z: cz });
        continue;
      }

      // বিল্ডিং
      const w = 14 + Math.random() * 8, d = 14 + Math.random() * 8, h = 8 + Math.random() * 22;
      const bx = cx + (Math.random() * 4 - 2), bz = cz + (Math.random() * 4 - 2);
      const base = pick(palette);
      const wallTex = facadeTex(base).clone();
      wallTex.repeat.set(Math.max(1, Math.round(w / 8)), Math.max(1, Math.round(h / 8)));
      const wall = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.85 });
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [wall, wall, roofMat, wall, wall, wall]);
      mesh.position.set(bx, h / 2, bz);
      mesh.castShadow = true; mesh.receiveShadow = true;
      scene.add(mesh);
      const shop = Math.random() < 0.6;
      boxes.push({ minX: bx - w / 2, maxX: bx + w / 2, minZ: bz - d / 2, maxZ: bz + d / 2, h, name: shop ? 'দোকান' : h > 22 ? 'অফিস টাওয়ার' : 'বাসা' });

      // দোকানের ছাউনি
      if (shop) {
        const aw = new THREE.Mesh(
          new THREE.BoxGeometry(w * 0.8, 0.25, 1.6),
          new THREE.MeshStandardMaterial({ color: pick(awningColors), roughness: 0.7 })
        );
        aw.position.set(bx, 3.2, bz + d / 2 + 0.8);
        aw.castShadow = true;
        scene.add(aw);
      }

      addTree(cx - 14, cz - 14, 0.7);
    }
  }
  buildStreet();
  buildNPCs();
}

// ---------- গাছ (ওক গাছের মতো ঘন পাতা, বাতাসে দোলে) ----------
const UPV = new THREE.Vector3(0, 1, 0);
const windU = { value: 0 };
function windify(mat, amp) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = windU;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
#ifdef USE_INSTANCING
 vec3 ip = instanceMatrix[3].xyz;
 float w = uTime * 1.7 + ip.x * 0.6 + ip.z * 0.4;
 transformed.x += sin(w + position.y * 2.0) * ${amp};
 transformed.z += cos(w * 0.8 + position.x * 2.0) * ${amp};
 transformed.y += sin(w * 1.3) * ${amp * 0.4};
#endif`);
  };
}
const leafTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#6fa447'; g.fillRect(0, 0, w, h);
  const cols = ['#4c7f35', '#5f9740', '#86bd55', '#a3d66a', '#3f6e2d'];
  for (let i = 0; i < 380; i++) {
    g.fillStyle = cols[i % 5];
    g.beginPath(); g.ellipse(Math.random() * w, Math.random() * h, 3 + Math.random() * 4, 1.5 + Math.random() * 2, Math.random() * 3, 0, 6.3); g.fill();
  }
});
const leafMat = new THREE.MeshStandardMaterial({ map: leafTex, roughness: 0.85, flatShading: true });
windify(leafMat, 0.07);
const fruitMat = new THREE.MeshStandardMaterial({ roughness: 0.4 });
windify(fruitMat, 0.07);
const barkMat = new THREE.MeshStandardMaterial({ color: 0x5e4630, roughness: 1, flatShading: true });
const leafGeo = new THREE.IcosahedronGeometry(1, 1);
{
  const pa = leafGeo.attributes.position;
  for (let i = 0; i < pa.count; i++) {
    const x = pa.getX(i), y = pa.getY(i), z = pa.getZ(i);
    const k = Math.abs(Math.sin(x * 12.9 + y * 78.2 + z * 37.7) * 43758.5) % 1;
    const f = 1 + (k - 0.5) * 0.35;
    pa.setXYZ(i, x * f, y * f, z * f);
  }
  leafGeo.computeVertexNormals();
}
const fruitGeo = new THREE.SphereGeometry(0.12, 6, 5);
const trunkGeo = new THREE.CylinderGeometry(0.26, 0.5, 1, 8), limbGeo = new THREE.CylinderGeometry(0.07, 0.17, 1, 6);
const leafData = [], fruitData = [];
const cDark = new THREE.Color(0x5f8f45), cLight = new THREE.Color(0xd2ee9f);
function addTree(x, z, sc = 1) {
  const gy = 0.15, th = 2.4 + Math.random(), R = (2.8 + Math.random() * 1.2) * sc, ch = (2.6 + Math.random() * 0.8) * (0.7 + 0.3 * sc);
  const g = new THREE.Group(); g.position.set(x, gy, z); scene.add(g);
  const trunk = new THREE.Mesh(trunkGeo, barkMat);
  trunk.scale.y = th; trunk.position.y = th / 2; trunk.castShadow = true; g.add(trunk);
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * 6.283 + Math.random();
    const st = new THREE.Vector3(0, th * 0.75, 0), en = new THREE.Vector3(Math.cos(a) * R * 0.55, th + ch * 0.5, Math.sin(a) * R * 0.55);
    const d = en.clone().sub(st), len = d.length();
    const l = new THREE.Mesh(limbGeo, barkMat);
    l.scale.y = len; l.position.copy(st).addScaledVector(d, 0.5); l.quaternion.setFromUnitVectors(UPV, d.normalize());
    l.castShadow = true; g.add(l);
  }
  const clumps = [];
  for (let i = 0; i < 16; i++) {
    let px = 0, pz = 0, py = th + ch * 0.85;
    if (i > 0) {
      const th2 = Math.random() * 6.283, d = R * Math.sqrt(Math.random()) * 0.95;
      px = Math.cos(th2) * d; pz = Math.sin(th2) * d;
      py = th + 0.3 + ch * Math.sqrt(Math.max(0, 1 - (d / R) ** 2)) * (0.25 + 0.75 * Math.random());
    }
    const sz = (1.3 + Math.random() * 0.6) * (0.75 + 0.25 * sc);
    leafData.push({ p: new THREE.Vector3(x + px, gy + py, z + pz), q: new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random() * 6, Math.random() * 6, Math.random() * 6)), s: sz, c: cDark.clone().lerp(cLight, Math.random()) });
    clumps.push({ x: x + px, y: gy + py, z: z + pz, s: sz });
  }
  for (let f = 0; f < 3; f++) {
    const c = clumps[1 + Math.floor(Math.random() * 15)];
    const dir = new THREE.Vector3(Math.random() - 0.5, -0.2 + Math.random() * 0.6, Math.random() - 0.5).normalize();
    fruitData.push({ p: new THREE.Vector3(c.x + dir.x * c.s * 0.95, c.y + dir.y * c.s * 0.8, c.z + dir.z * c.s * 0.95), q: new THREE.Quaternion(), s: 1, c: new THREE.Color(pick([0xe63946, 0xf4a024, 0xf1d332])) });
  }
}
function finalizeTrees() {
  const mk = (geo, mat, data, sy) => {
    const im = new THREE.InstancedMesh(geo, mat, data.length), m = new THREE.Matrix4();
    data.forEach((d, i) => { m.compose(d.p, d.q, new THREE.Vector3(d.s, d.s * sy, d.s)); im.setMatrixAt(i, m); im.setColorAt(i, d.c); });
    im.castShadow = true; im.frustumCulled = false; scene.add(im);
  };
  mk(leafGeo, leafMat, leafData, 0.85);
  mk(fruitGeo, fruitMat, fruitData, 1);
}

// ---------- ফুটপাত, ল্যাম্পপোস্ট, বিদ্যুতের খুঁটি, তার, সিগন্যাল ----------
const walkTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#b9b6ae'; g.fillRect(0, 0, w, h);
  noise(g, w, h, ['#aaa79f', '#c6c3bb'], 200);
  g.strokeStyle = '#8f8c85'; g.lineWidth = 2; g.strokeRect(0, 0, w, h);
  g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
});
walkTex.repeat.set(8, 8);
const walkMat = new THREE.MeshStandardMaterial({ map: walkTex, roughness: 0.95 });
const slabGeo = new THREE.BoxGeometry(30, 0.15, 30);
const parkGroundMat = new THREE.MeshStandardMaterial({ color: 0x6fbf55, roughness: 1 });
let gyS = 0;
function groundY(x, z) {
  if (Math.abs(x) > 155 || Math.abs(z) > 155) return 0;
  const mx = ((x % 40) + 40) % 40, mz = ((z % 40) + 40) % 40;
  return (mx > 5 && mx < 35 && mz > 5 && mz < 35) ? 0.15 : 0;
}
function addSidewalk(cx, cz, park) {
  blocksList.push({ cx, cz, park });
  const s = new THREE.Mesh(slabGeo, walkMat);
  s.position.set(cx, 0.075, cz); s.receiveShadow = true; scene.add(s);
  if (park) {
    const p = new THREE.Mesh(new THREE.PlaneGeometry(26, 26), parkGroundMat);

let lampTick = 0;
function animateWorld(t, dt) {
  windU.value = t;

  const ph = t % 12, hG = ph < 5, hY = ph >= 5 && ph < 6, vG = ph >= 6 && ph < 11, vY = ph >= 11;
  if (sigH) {
    sigH.material.color.set(hG ? 0x2ecc71 : hY ? 0xf1c40f : 0xe74c3c);
    sigV.material.color.set(vG ? 0x2ecc71 : vY ? 0xf1c40f : 0xe74c3c);
  }
  for (const c of cars) {
    let target = c.vmax;
    const go = c.axis === 'x' ? hG : vG;
    const n = c.dir > 0 ? Math.ceil((c.pos + 0.01) / SPACING) * SPACING : Math.floor((c.pos - 0.01) / SPACING) * SPACING;
    const d = (n - c.pos) * c.dir;
    if (!go && d > 6.8 && d < 14) target = Math.min(target, (d - 7.2) * 1.5);
    for (const o of cars) {
      if (o === c || o.axis !== c.axis || o.dir !== c.dir || o.p !== c.p) continue;

    const near = lamps.map(l => ({ l, d: (l.x - player.x) ** 2 + (l.z - player.z) ** 2 })).sort((a, b) => a.d - b.d).slice(0, 4);

// Mixamo মডেল লোড (models/boy.glb, models/girl.glb, models/idle.glb, walk.glb, run.glb)
async function buildCharacter(gender) {
  const gltf = await loadGLTF(`models/${gender}.fbx`);
  if (!gltf) return makePrimitive(gender);

  const model = gltf;
  model.rotation.y = MODEL_YAW;
  let box = new THREE.Box3().setFromObject(model);
  const s = CHAR_HEIGHT / (box.max.y - box.min.y);
  model.scale.setScalar(s);
  box = new THREE.Box3().setFromObject(model);
  model.position.y -= box.min.y;
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });

  const group = new THREE.Group();
  group.add(model);

  const mixer = new THREE.AnimationMixer(model);
  const actions = {};
  for (const [n, f] of [['idle', 'Idle'], ['walk', 'Walk'], ['run', 'Run']]) {
    const a = await loadGLTF(`models/${f}.fbx`);
    if (a && a.animations.length) { const clip = a.animations[0]; clip.tracks = clip.tracks.filter(t => !t.name.endsWith('.position')); actions[n] = mixer.clipAction(clip, model); }
  }
  return { group, mixer, actions, current: null, state: null };
}

let ac = null;
function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  // পরিবেশের শব্দের প্লেসহোল্ডার (পরে আসল সাউন্ড ফাইল দিয়ে বদলাবেন)
  const len = ac.sampleRate * 2;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
  const src = ac.createBufferSource();
  src.buffer = buf; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400;
  const g = ac.createGain(); g.gain.value = 0.04;
  src.connect(f).connect(g).connect(ac.destination);
  src.start();
}
function playStep(run) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle';
  o.frequency.value = (run ? 140 : 110) + Math.random() * 30;
  const t = ac.currentTime;
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + 0.09);
}

const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
const player = { x: 0, y: 0, z: 20, yaw: 0 };
let stance = 'stand', jumping = false, vy = 0, cr = 0, pr = 0;
let char = null, started = false;
let phase = 0, amp = 0, lastStep = 0;
let spd = 0;

function blocked(x, z) {
  for (const b of boxes) {
    if (x > b.minX - PR && x < b.maxX + PR && z > b.minZ - PR && z < b.maxZ + PR) return true;
  }
  return false;
}

function update(dt) {
  const kbX = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  const kbY = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  let ix = Math.max(-1, Math.min(1, kbX + jx));
  let iy = Math.max(-1, Math.min(1, kbY + jy));
  const run = (runTouch || keys.has('ShiftLeft') || keys.has('ShiftRight')) && stance === 'stand' && combatT <= 0;
  if (run && Math.hypot(ix, iy) < 0.1) { ix = 0; iy = 1; }   // দৌড় চালু থাকলে জয়স্টিক ছাড়াই সামনে দৌড়ায়
  const mag = Math.min(1, Math.hypot(ix, iy));
  const moving = mag > 0.1;

  const tSpeed = moving ? (run ? RUN : stance === 'crouch' ? WALK * 0.5 : stance === 'prone' ? WALK * 0.25 : WALK) * mag * (combatT > 0 ? 0.7 : 1) : 0;
  spd += (tSpeed - spd) * (1 - Math.exp(-dt * (tSpeed > spd ? 4 : 9)));
  if (moving) {
    const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
    const rx = -Math.cos(camYaw), rz = Math.sin(camYaw);
    let dx = fx * iy + rx * ix, dz = fz * iy + rz * ix;
    const len = Math.hypot(dx, dz) || 1;
    dx /= len; dz /= len;

    if (combatT <= 0) player.yaw += wrap(Math.atan2(dx, dz) - player.yaw) * (1 - Math.exp(-dt * 12));

    const speed = spd;
    const nx = player.x + dx * speed * dt;
    const nz = player.z + dz * speed * dt;
    if (!blocked(nx, player.z)) player.x = nx;
    if (!blocked(player.x, nz)) player.z = nz;
    player.x = Math.max(-180, Math.min(180, player.x));

  document.getElementById('dbg').textContent = 'x:' + jx.toFixed(2) + ' y:' + jy.toFixed(2) + (run ? ' RUN' : '') + (jumping ? ' JUMP' : '') + (stance !== 'stand' ? ' ' + stance.toUpperCase() : '') + ' h:' + player.y.toFixed(2);

  document.getElementById('jump').classList.toggle('on', jumping);

  const stepIdx = Math.floor(phase / Math.PI);
  if (moving && stepIdx !== lastStep) { lastStep = stepIdx; playStep(run); }

  // ক্যামেরা: yaw = ৩৬০° ঘোরা, pitch = আকাশ/নিচ দেখা (সোয়াইপ)
  const D = 6, H = 2.2, cp = Math.cos(camPitch), sp = Math.sin(camPitch), eyeOff = cr * 0.55 + pr * 1.1;

  sun.target.position.set(player.x, 0, player.z);
}

const nid = (i, j) => (i + 4) * 9 + (j + 4);

function snapRoad(x, z) {
  const vi = Math.max(-4, Math.min(4, Math.round(x / 40))), hj = Math.max(-4, Math.min(4, Math.round(z / 40)));

  for (let i = -4; i <= 4; i++) for (let j = -4; j <= 4; j++) {

  let best = null, bd = 1e9; const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
  for (const n of npcs) {
    if (n.dead) continue;
    const dx = n.g.position.x - player.x, dz = n.g.position.z - player.z, d = Math.hypot(dx, dz);
    if (d > maxDist || d < 0.01) continue;
    const ang = Math.acos(Math.max(-1, Math.min(1, (dx * fx + dz * fz) / d)));
    if (ang < maxDeg * Math.PI / 180 && ang < bd) { bd = ang; best = n; }
  }
  return best;
}
function rayBox(o, d, x0, x1, y0, y1, z0, z1) {
  let tmin = 0, tmax = 1e9;
  for (const [p, v, lo, hi] of [[o.x, d.x, x0, x1], [o.y, d.y, y0, y1], [o.z, d.z, z0, z1]]) {
    if (Math.abs(v) < 1e-8) { if (p < lo || p > hi) return Infinity; }
    else {
      let t1 = (lo - p) / v, t2 = (hi - p) / v; if (t1 > t2) [t1, t2] = [t2, t1];
      tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2); if (tmin > tmax) return Infinity;
    }
  }
  return tmin;
}
function castRay(o, d, maxT) {
  let bestT = maxT, hit = null;
  for (const n of npcs) {
    if (n.dead) continue;
    const c = n.g.position;
    for (const [h, r] of [[0.45, 0.4], [1.2, 0.55], [1.9, 0.3]]) {
      const cx = c.x - o.x, cy = c.y + h - o.y, cz = c.z - o.z, b = cx * d.x + cy * d.y + cz * d.z;
      if (b < 0) continue;
      const disc = b * b - (cx * cx + cy * cy + cz * cz - r * r);
      if (disc < 0) continue;
      const t = b - Math.sqrt(disc);
      if (t >= 0 && t < bestT) { bestT = t; hit = { type: 'npc', n, head: h > 1.5 }; }
    }
  }
  for (const b of boxes) {
    const t = rayBox(o, d, b.minX, b.maxX, 0, b.h || 9, b.minZ, b.maxZ);
    if (t < bestT) { bestT = t; hit = { type: 'wall' }; }
  }
  if (d.y < 0) { const t = (0.15 - o.y) / d.y; if (t > 0 && t < bestT) { bestT = t; hit = { type: 'ground' }; } }
  return { t: bestT, hit };
}
function hurtNPC(n, dmg, dx, dz, kb) {
  if (n.dead) return;
  n.hp -= dmg; n.flash = 0.25;
  const L = Math.hypot(dx, dz) || 1; n.knock.x += dx / L * kb; n.knock.z += dz / L * kb;
  if (n.hp <= 0) { n.dead = true; n.deadT = 0; kills++; }
}
function shoot() {
  if (ammo <= 0) { reloadT = 1.4; return; }
  ammo--; fireCD = 0.14; startCombat(); gunT = 2.5; atk = null; recoil = 0.14; muzzleT = 0.05;
  const tg = aimNPC(10, 60);
  const o = new THREE.Vector3(player.x + Math.sin(player.yaw) * 0.5, player.y + 1.35 - cr * 0.4 - pr * 1.0, player.z + Math.cos(player.yaw) * 0.5);
  let d;
  if (tg) d = new THREE.Vector3(tg.g.position.x, tg.g.position.y + 1.2, tg.g.position.z).sub(o).normalize();
  else { const pt = Math.max(-0.2, Math.min(0.6, camPitch * 0.5)); d = new THREE.Vector3(Math.sin(camYaw) * Math.cos(pt), Math.sin(pt), Math.cos(camYaw) * Math.cos(pt)); }
  const r = castRay(o, d, 80), end = o.clone().addScaledVector(d, Math.min(r.t, 80));
  spawnTracer(o, end);
  muzzle.position.copy(o); sfx('gun');
  if (r.hit) {
    if (r.hit.type === 'npc') { spawnSpark(end, 0xff3b3b); hurtNPC(r.hit.n, r.hit.head ? 50 : 25, d.x, d.z, 2); }
    else spawnSpark(end, 0xffd25a);
  }
  if (ammo <= 0) reloadT = 1.4;
}
function meleeHit(type) {
  const range = type === 'punch' ? 2.2 : 2.7, dmg = type === 'punch' ? 12 : 22, kb = type === 'punch' ? 3 : 7;
  const fx = Math.sin(player.yaw), fz = Math.cos(player.yaw);
  let any = false;
  for (const n of npcs) {
    if (n.dead) continue;
    const dx = n.g.position.x - player.x, dz = n.g.position.z - player.z, d = Math.hypot(dx, dz);
    if (d > range || d < 0.01) continue;
    if (Math.acos(Math.max(-1, Math.min(1, (dx * fx + dz * fz) / d))) > 1.1) continue;
    hurtNPC(n, dmg, dx, dz, kb); any = true;
    spawnSpark(new THREE.Vector3(n.g.position.x, n.g.position.y + 1.2, n.g.position.z), 0xff3b3b);
  }
  sfx(type === 'punch' ? 'punch' : 'kick');
}
function updateCombat(dt) {
  combatT = Math.max(0, combatT - dt); gunT = Math.max(0, gunT - dt); atkCD = Math.max(0, atkCD - dt);
  fireCD = Math.max(0, fireCD - dt); muzzleT = Math.max(0, muzzleT - dt); recoil *= Math.exp(-dt * 18);
  if (reloadT > 0) { reloadT -= dt; if (reloadT <= 0) ammo = 30; }
  if (fireHeld && fireCD <= 0 && reloadT <= 0) shoot();
  if (atk) {
    atk.t += dt;
    if (!atk.hit && atk.t >= atk.dur * 0.4) { atk.hit = true; meleeHit(atk.type); }
    if (atk.t >= atk.dur) atk = null;
  }
  muzzle.intensity = muzzleT > 0 ? 80 : 0;
  for (const t of tracers) if (t.t > 0) { t.t -= dt; if (t.t <= 0) t.m.visible = false; }
  for (const sp of sparks) if (sp.t > 0) {
    sp.t -= dt; sp.m.scale.setScalar(0.5 + (0.25 - sp.t) * 6); sp.m.material.opacity = Math.max(0, sp.t / 0.25);
    if (sp.t <= 0) sp.m.visible = false;
  }
  const h = '🔫 ' + (reloadT > 0 ? 'রিলোড…' : ammo) + '/30 · 💥 ' + kills;
  if (h !== lastHud) { lastHud = h; document.getElementById('ammo').textContent = h; }
}
function holdBtn(id, on, off) {
  const b = document.getElementById(id);
  const dn = e => { e.preventDefault(); e.stopPropagation(); on(); };
  const up = e => { e.preventDefault(); off(); };
  for (const ev of ['pointerdown', 'touchstart', 'mousedown']) b.addEventListener(ev, dn, { passive: false });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave', 'touchend', 'touchcancel', 'mouseup', 'mouseleave']) b.addEventListener(ev, up, { passive: false });
  b.addEventListener('contextmenu', e => e.preventDefault());
}
holdBtn('fire', () => { fireHeld = true; }, () => { fireHeld = false; });
holdBtn('punch', () => doPunch(), () => {});
holdBtn('kick', () => doKick(), () => {});

// NPC (মার খায়, পড়ে যায়, ৬ সেকেন্ড পর আবার ওঠে)
function buildNPCs() {
  const cols = [0xe74c3c, 0xf39c12, 0x27ae60, 0x8e44ad, 0x16a085, 0xd35400], segs = [];
  for (let i = 0; i < 14; i++) {
    const cx = (-4 + Math.floor(Math.random() * 8)) * SPACING + 20, cz = (-4 + Math.floor(Math.random() * 8)) * SPACING + 20, sd = Math.random() < 0.5 ? 1 : -1;
    segs.push(Math.random() < 0.5 ? [[cx - 10, cz + 14.5 * sd], [cx + 10, cz + 14.5 * sd]] : [[cx + 14.5 * sd, cz - 10], [cx + 14.5 * sd, cz + 10]]);
  }
  for (const [x, z] of [[3, 32], [-3, 40], [4, 48]]) segs.push([[x, z - 2], [x, z + 2]]);
  for (const [a, b] of segs) {
    const c = makePrimitive(Math.random() < 0.5 ? 'boy' : 'girl'), mats = new Set();
    c.group.children[0].material.color.set(pick(cols));
    c.group.traverse(o => { if (o.isMesh) mats.add(o.material); });
    c.group.rotation.order = 'YXZ'; scene.add(c.group);
    npcs.push({ g: c.group, parts: c, mats: [...mats], hp: 100, a, b, t: Math.random(), dir: 1, knock: new THREE.Vector3(), flash: 0, dead: false, deadT: 0, phase: Math.random() * 6 });
  }
}
function updateNPCs(dt) {
  for (const n of npcs) {
    if (n.dead) {
      n.deadT += dt; const f = Math.min(1, n.deadT / 0.4);
      n.g.rotation.x = -f * Math.PI / 2; n.g.position.y = 0.15 + f * 0.15;
      if (n.deadT > 6) { n.dead = false; n.hp = 100; n.g.rotation.x = 0; n.knock.set(0, 0, 0); }
    } else {
      const len = Math.hypot(n.b[0] - n.a[0], n.b[1] - n.a[1]) || 1;
      n.t += n.dir * 1.3 * dt / len;
      if (n.t > 1) { n.t = 1; n.dir = -1; } else if (n.t < 0) { n.t = 0; n.dir = 1; }
      const x = n.a[0] + (n.b[0] - n.a[0]) * n.t, z = n.a[1] + (n.b[1] - n.a[1]) * n.t;
      n.knock.multiplyScalar(Math.exp(-dt * 4));
      const cur = n.g.position;
      cur.set(x + n.knock.x * 0.25 + (cur.userData?.ox || 0), 0.15, z + n.knock.z * 0.25);
      n.g.rotation.y = Math.atan2((n.b[0] - n.a[0]) * n.dir, (n.b[1] - n.a[1]) * n.dir);
      n.phase += dt * 6;
      n.parts.legL.rotation.x = Math.sin(n.phase) * 0.6; n.parts.legR.rotation.x = -Math.sin(n.phase) * 0.6;
      n.parts.armL.rotation.x = -Math.sin(n.phase) * 0.5; n.parts.armR.rotation.x = Math.sin(n.phase) * 0.5;
    }
    if (n.flash > 0) n.flash -= dt;
    const f = Math.max(0, n.flash) / 0.25 * 0.6;
    for (const m of n.mats) m.emissive.setRGB(f, 0, 0);
  }
}

// ---------- ৩য় চোখ (পেছনের দৃশ্য, ঘোরানো যায়) ----------
const eyeEl = document.getElementById('eye'), eyeCam = new THREE.PerspectiveCamera(85, 1.6, 0.2, 400);
let eyeOn = false, eyeYaw = 0, eyePitch = 0, eyeDrag = null, eyeLX = 0, eyeLY = 0, eyeTap = 0;
eyeEl.addEventListener('pointerdown', e => {
  e.stopPropagation(); eyeDrag = e.pointerId; eyeEl.setPointerCapture(e.pointerId); eyeLX = e.clientX; eyeLY = e.clientY;
  const n = performance.now(); if (n - eyeTap < 350) { eyeYaw = 0; eyePitch = 0; } eyeTap = n;
});
eyeEl.addEventListener('pointermove', e => {
  if (e.pointerId !== eyeDrag) return;
  eyeYaw -= (e.clientX - eyeLX) * 0.012; eyePitch = Math.max(-1, Math.min(1.2, eyePitch + (eyeLY - e.clientY) * 0.008));
  eyeLX = e.clientX; eyeLY = e.clientY;
});
const eyeEnd = e => { if (e.pointerId === eyeDrag) eyeDrag = null; };
eyeEl.addEventListener('pointerup', eyeEnd); eyeEl.addEventListener('pointercancel', eyeEnd);
bindTap(document.getElementById('eyebtn'), () => {
  eyeOn = !eyeOn; eyeEl.style.display = eyeOn ? 'block' : 'none';
  document.getElementById('eyebtn').classList.toggle('on', eyeOn);
});
function renderEye() {
  if (!eyeOn || !started) return;
  const r = eyeEl.getBoundingClientRect(); if (r.width < 10) return;
  const yaw = camYaw + Math.PI + eyeYaw, cp = Math.cos(eyePitch);
  eyeCam.aspect = r.width / r.height; eyeCam.updateProjectionMatrix();
  eyeCam.position.set(player.x + Math.sin(yaw) * 0.55, player.y + 2.2 - cr * 0.5 - pr * 1.1, player.z + Math.cos(yaw) * 0.55);
  eyeCam.lookAt(eyeCam.position.x + Math.sin(yaw) * cp, eyeCam.position.y + Math.sin(eyePitch), eyeCam.position.z + Math.cos(yaw) * cp);
  const y0 = innerHeight - r.bottom;
  renderer.setScissorTest(true); renderer.setViewport(r.left, y0, r.width, r.height); renderer.setScissor(r.left, y0, r.width, r.height);
  renderer.shadowMap.autoUpdate = false; renderer.render(scene, eyeCam); renderer.shadowMap.autoUpdate = true;
  renderer.setScissorTest(false); renderer.setViewport(0, 0, innerWidth, innerHeight);
}

// ---------- বাটন কাস্টমাইজ (টেনে সরানো, সাইজ, স্বচ্ছতা, সেভ) ----------
const CUST = ['joy', 'run', 'jump', 'crouch', 'prone', 'punch', 'kick', 'fire', 'eyebtn', 'mini', 'eye'];
const CNAME = { joy: 'জয়স্টিক', run: 'দৌড়', jump: 'লাফ', crouch: 'বসুন', prone: 'শুয়ুন', punch: 'ঘুসি', kick: 'লাথি', fire: 'ফায়ার', eyebtn: '৩য় চোখ বাটন', mini: 'মিনি ম্যাপ', eye: '৩য় চোখের জানালা' };
const OPAQ = ['joy', 'run', 'jump', 'crouch', 'prone', 'punch', 'kick', 'fire', 'eyebtn'];
let layout = { op: 1 }, editMode = false, selId = null, dragP = null, dragOff = [0, 0];
try { const j = localStorage.getItem('wt_layout'); if (j) layout = Object.assign({ op: 1 }, JSON.parse(j)); } catch (e) {}
CUST.forEach(id => { document.getElementById(id).dataset.cust = id; });
function placeEl(id) {
  const el = document.getElementById(id), L = layout[id]; if (!L) return;
  el.style.left = (L.x * innerWidth) + 'px'; el.style.top = (L.y * innerHeight) + 'px';
  el.style.right = 'auto'; el.style.bottom = 'auto';
  el.style.transform = `translate(-50%,-50%) scale(${L.s || 1})`;
}
function applyLayout() {
  CUST.forEach(placeEl);
  for (const id of OPAQ) document.getElementById(id).style.opacity = layout.op || 1;
}
function ensureLayout(id) {
  if (layout[id]) return layout[id];
  const r = document.getElementById(id).getBoundingClientRect();
  return (layout[id] = { x: (r.left + r.width / 2) / innerWidth, y: (r.top + r.height / 2) / innerHeight, s: 1 });
}
function selectEl(id) {
  selId = id;
  CUST.forEach(i => document.getElementById(i).classList.toggle('sel', i === id));
  const L = ensureLayout(id);
  document.getElementById('szr').value = L.s || 1;
  document.getElementById('edtxt').textContent = 'বাছাই: ' + CNAME[id] + ' · টেনে সরান, সাইজ বদলান';
}
function saveLayout() { try { localStorage.setItem('wt_layout', JSON.stringify(layout)); } catch (e) {} }
function toggleEdit() {
  editMode = !editMode;
  const bar = document.getElementById('editbar');
  document.body.classList.toggle('editing', editMode);
  bar.style.display = editMode ? 'flex' : 'none';
  if (editMode) {
    jx = 0; jy = 0; fireHeld = false; selId = null; dragP = null;
    document.getElementById('eye').style.display = 'block';
    document.getElementById('opr').value = layout.op || 1;
    document.getElementById('edtxt').textContent = 'টেনে সরান · ট্যাপ করে বাছুন';
  } else {
    document.getElementById('eye').style.display = eyeOn ? 'block' : 'none';
    CUST.forEach(i => document.getElementById(i).classList.remove('sel'));
    saveLayout();
  }
}
bindTap(document.getElementById('gear'), toggleEdit);
document.getElementById('edsave').addEventListener('click', () => { if (editMode) toggleEdit(); });
document.getElementById('edflip').addEventListener('click', () => document.getElementById('editbar').classList.toggle('bottom'));
document.getElementById('edreset').addEventListener('click', () => {
  layout = { op: 1 };
  CUST.forEach(id => { const st = document.getElementById(id).style; st.left = st.top = st.right = st.bottom = st.transform = st.opacity = ''; });
  document.getElementById('opr').value = 1; document.getElementById('szr').value = 1; selId = null;
  CUST.forEach(i => document.getElementById(i).classList.remove('sel'));
  try { localStorage.removeItem('wt_layout'); } catch (e) {}
});
document.getElementById('szr').addEventListener('input', e => {
  if (!selId) return; ensureLayout(selId).s = +e.target.value; placeEl(selId);
});
document.getElementById('opr').addEventListener('input', e => { layout.op = +e.target.value; applyLayout(); });
const inBar = e => e.target.closest && e.target.closest('#editbar,#gear');
addEventListener('pointerdown', e => {
  if (!editMode || inBar(e)) return;
  e.preventDefault(); e.stopPropagation();
  const el = e.target.closest('[data-cust]'); if (!el) return;
  selectEl(el.id);
  const r = el.getBoundingClientRect();
  dragP = e.pointerId; dragOff = [e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)];
}, { capture: true, passive: false });
addEventListener('pointermove', e => {
  if (!editMode || e.pointerId !== dragP || !selId) return;
  e.stopPropagation();
  const L = layout[selId];
  L.x = Math.max(0.03, Math.min(0.97, (e.clientX - dragOff[0]) / innerWidth));
  L.y = Math.max(0.03, Math.min(0.97, (e.clientY - dragOff[1]) / innerHeight));
  placeEl(selId);
}, true);
for (const ev of ['pointerup', 'pointercancel']) addEventListener(ev, e => {
  if (!editMode || inBar(e)) return;
  if (e.pointerId === dragP) dragP = null;
  e.stopPropagation();
}, true);
for (const ev of ['touchstart', 'touchend', 'mousedown', 'mouseup', 'click']) addEventListener(ev, e => {
  if (!editMode || inBar(e)) return;
  e.preventDefault(); e.stopPropagation();
}, { capture: true, passive: false });
addEventListener('resize', applyLayout);
applyLayout();

// ---------- লুপ (৩০ FPS সীমা) ----------
let last = performance.now(), fpsFrames = 0, fpsTime = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const el = now - last;
  if (el < 33) return;
  last = now;
  const dt = Math.min(el / 1000, 0.05);

  animateWorld(now / 1000, dt);
  if (started && !mapOpen && !editMode) update(dt);
  renderer.render(scene, camera);
  renderEye();
  if (started) { updateRoute(now); drawMini(); if (mapOpen) drawBig(); }

  fpsFrames++; fpsTime += el;
  if (fpsTime >= 1000) {
    document.getElementById('fps').textContent = 'FPS: ' + fpsFrames;
    fpsFrames = 0; fpsTime = 0;
  }
}

// ---------- শুরু ----------
buildWorld();
camera.position.set(player.x, 3, player.z - 6);
camera.lookAt(player.x, 1.6, player.z);
requestAnimationFrame(loop);

async function startGame(gender) {
  document.querySelectorAll('#start button').forEach(b => b.disabled = true);
  document.getElementById('msg').textContent = 'লোড হচ্ছে...';
  if (!ac) initAudio();
  if (ac.state === 'suspended') ac.resume();

  char = await buildCharacter(gender);
  scene.add(char.group);
  camYaw = 0; player.yaw = 0;
  started = true;

  document.getElementById('start').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('mini').style.display = 'block';
  document.getElementById('joy').style.display = 'block';
  document.getElementById('run').style.display = 'block';
  document.querySelectorAll('.act').forEach(b => b.style.display = 'block');
}
document.getElementById('boy').addEventListener('click', () => startGame('boy'));
document.getElementById('girl').addEventListener('click', () => startGame('girl'));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
