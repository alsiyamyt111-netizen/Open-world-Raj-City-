    .scr { position: fixed; inset: 0; z-index: 30; display: none; color: #fff; font-family: sans-serif; }

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/FBXLoader.js';
import * as SkeletonUtils from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/SkeletonUtils.js';

// ---------- সরাসরি landscape: ফোন portrait-এ থাকলে পুরো গেম ভেতরে ৯০° ঘুরিয়ে দেখায় (কোনো পারমিশন/ঘোরানো লাগে না) ----------
// innerWidth/Height, টাচ-স্থানাঙ্ক ও getBoundingClientRect একসঙ্গে বদলানো হয়, তাই বাকি কোড অপরিবর্তিত।
const __iwD = Object.getOwnPropertyDescriptor(window, 'innerWidth'), __ihD = Object.getOwnPropertyDescriptor(window, 'innerHeight');
const __rW = () => (__iwD && __iwD.get ? __iwD.get.call(window) : document.documentElement.clientWidth);
const __rH = () => (__ihD && __ihD.get ? __ihD.get.call(window) : document.documentElement.clientHeight);
const __touch = matchMedia('(pointer: coarse)').matches;
let FAKE = false;
Object.defineProperty(window, 'innerWidth', { configurable: true, get: () => (FAKE ? __rH() : __rW()) });
Object.defineProperty(window, 'innerHeight', { configurable: true, get: () => (FAKE ? __rW() : __rH()) });
{
  const gx = Object.getOwnPropertyDescriptor(MouseEvent.prototype, 'clientX').get, gy = Object.getOwnPropertyDescriptor(MouseEvent.prototype, 'clientY').get;
  Object.defineProperty(MouseEvent.prototype, 'clientX', { configurable: true, get() { return FAKE ? gy.call(this) : gx.call(this); } });
  Object.defineProperty(MouseEvent.prototype, 'clientY', { configurable: true, get() { return FAKE ? __rW() - gx.call(this) : gy.call(this); } });
  const gbr = Element.prototype.getBoundingClientRect;
  Element.prototype.getBoundingClientRect = function () {
    const r = gbr.call(this); if (!FAKE) return r;
    return new DOMRect(r.top, __rW() - r.right, r.height, r.width);
  };
}
function applyFake() {
  const W = __rW(), H = __rH(), b = document.body.style, de = document.documentElement.style;
  FAKE = __touch && H > W;
  if (FAKE) Object.assign(b, { position: 'fixed', left: '0', top: '0', width: H + 'px', height: W + 'px', transformOrigin: '0 0', transform: `translateX(${W}px) rotate(90deg)` });
  else { b.position = b.left = b.top = b.width = b.height = b.transformOrigin = b.transform = ''; }
  de.setProperty('--vw', (FAKE ? H : W) / 100 + 'px'); de.setProperty('--vh', (FAKE ? W : H) / 100 + 'px');
}
addEventListener('resize', applyFake);
addEventListener('orientationchange', applyFake);
applyFake();

// ---------- কনফিগ ----------
const MAP = 200, SPACING = 40, ROAD_W = 10, PR = 0.45;
const WALK = 4.5, RUN = 7;
const CHAR_HEIGHT = 1.8;
const MODEL_YAW = 0;          // চরিত্র উল্টো দিকে হাঁটলে এটি Math.PI করুন

// ---------- সেটআপ ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb6e0);
scene.fog = new THREE.Fog(0x8fb6e0, 90, 280);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.domElement.id = 'game';
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x6a8a50, 0.75));
const sun = new THREE.DirectionalLight(0xffd9a8, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, far: 300 });
scene.add(sun, sun.target);

// ---------- টেক্সচার (কোড দিয়ে তৈরি) ----------
function noise(g, w, h, colors, count) {
  for (let i = 0; i < count; i++) {
    g.fillStyle = colors[Math.floor(Math.random() * colors.length)];
    g.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
const grassTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#7cc45a'; g.fillRect(0, 0, w, h);
  noise(g, w, h, ['#6fb24f', '#8fd46a', '#68a84a'], 700);
});
grassTex.repeat.set(MAP * 2 / 8, MAP * 2 / 8);

const roadTexH = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#4b5059'; g.fillRect(0, 0, w, h);
  noise(g, w, h, ['#434851', '#555b64'], 300);
  g.fillStyle = '#f2efe6';
  for (let x = 0; x < w; x += 16) g.fillRect(x, h / 2 - 1, 8, 2);
});
roadTexH.repeat.set(MAP * 2 / 8, 1);
const roadTexV = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#4b5059'; g.fillRect(0, 0, w, h);
  noise(g, w, h, ['#434851', '#555b64'], 300);
  g.fillStyle = '#f2efe6';
  for (let y = 0; y < h; y += 16) g.fillRect(w / 2 - 1, y, 2, 8);
});
roadTexV.repeat.set(1, MAP * 2 / 8);

// জানালাওয়ালা দেয়াল (প্রতিটি রঙের জন্য একবার তৈরি)
const facadeCache = {};
function facadeTex(base) {
  if (facadeCache[base]) return facadeCache[base];
  const t = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(0, h - 28, w, 28);
    for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {
      const x = 28 + c * 112, y = 36 + r * 100;
      g.fillStyle = '#2f4558'; g.fillRect(x, y, 72, 64);
      g.fillStyle = '#9fc7e0'; g.fillRect(x + 6, y + 6, 60, 22);
      g.fillStyle = '#ffffff'; g.fillRect(x - 4, y + 64, 80, 6);
    }
  });
  facadeCache[base] = t;
  return t;
}

// ---------- ওয়ার্ল্ড ----------
const boxes = [];
const roadCenters = [];
const blocksList = [], parks = [];
const mctx = document.getElementById('mini').getContext('2d');
const palette = ['#f4e3c1', '#f6c6a8', '#d9e8f5', '#e8f5c8', '#f5d0e0', '#c9d6f0', '#fff3d1', '#e9dccb'];
const awningColors = ['#e74c3c', '#2ecc71', '#3498db', '#f1c40f', '#9b59b6'];
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

const roofMat = new THREE.MeshStandardMaterial({ color: 0x8a8f96, roughness: 0.9 });
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 1 });

// ---------- বাড়ির চত্বর: পাঁচিল, গেট, গ্যারেজ, ফুলের বাগান ----------
const compBoxes = [], compCaps = [], compPlants = [], compounds = [];
const wallCols = ['#c97b5a', '#d8cbb0', '#b8bdc4', '#e4d5a8', '#a86f4a', '#e9e2d0'];
const flowerCols = ['#ff4d6d', '#ffd23f', '#ffffff', '#c77dff', '#ff9f1c', '#ff6fb5'];
const leafCols = ['#2f8f3f', '#3fa34d', '#57b84f', '#4c9a3a'];
function addCompound(cx, cz, gs, w, d, shop, hasGarage) {
  const C = [1, 0, -1, 0][gs], S = [0, 1, 0, -1][gs], Y0 = 0.15;
  const rc = (lx, lz) => [cx + lx * C + lz * S, cz - lx * S + lz * C];
  const rect = (lx0, lz0, lx1, lz1) => {
    const a = rc(lx0, lz0), b = rc(lx1, lz1);
    return { minX: Math.min(a[0], b[0]), maxX: Math.max(a[0], b[0]), minZ: Math.min(a[1], b[1]), maxZ: Math.max(a[1], b[1]) };
  };
  const box = (lx0, lz0, lx1, lz1, y0, y1, color, solid, name) => {
    const r = rect(lx0, lz0, lx1, lz1);
    compBoxes.push({ p: [(r.minX + r.maxX) / 2, Y0 + (y0 + y1) / 2, (r.minZ + r.maxZ) / 2], s: [r.maxX - r.minX, y1 - y0, r.maxZ - r.minZ], c: color });
    if (solid) boxes.push({ ...r, h: y1, ...(name ? { name } : {}) });
  };
  const cap = (lx, lz, y, r, color) => { const q = rc(lx, lz); compCaps.push({ p: [q[0], Y0 + y, q[1]], s: [r, r, r], c: color }); };
  const wc = pick(wallCols), HW = 12.5, T = 0.3, WH = 2.1, G = 2.2;
  // পাঁচিল (সামনে গেটের ফাঁক)
  box(-HW, -HW, HW, -HW + T, 0, WH, wc, true);
  box(-HW, -HW, -HW + T, HW, 0, WH, wc, true);
  box(HW - T, -HW, HW, HW, 0, WH, wc, true);
  box(-HW, HW - T, -G, HW, 0, WH, wc, true);
  box(G, HW - T, HW, HW, 0, WH, wc, true);
  for (const [px, pz] of [[-HW, -HW], [HW, -HW], [-HW, HW], [HW, HW]]) { box(px - 0.35, pz - 0.35, px + 0.35, pz + 0.35, 0, 2.5, '#d9d3c4', false); cap(px, pz, 2.7, 0.3, '#efe9da'); }
  // গেটের খুঁটি + খোলা লোহার গেট
  for (const sg of [-1, 1]) {

let lampTick = 0;
function animateWorld(t, dt) {
  windU.value = t;

  const ph = t % 12, hG = ph < 5, hY = ph >= 5 && ph < 6, vG = ph >= 6 && ph < 11, vY = ph >= 11;
  if (sigH) {

    let target = c.vmax;
    const go = c.axis === 'x' ? hG : vG;
    const n = c.dir > 0 ? Math.ceil((c.pos + 0.01) / SPACING) * SPACING : Math.floor((c.pos - 0.01) / SPACING) * SPACING;
    const d = (n - c.pos) * c.dir;
    if (!go && d > 6.8 && d < 14) target = Math.min(target, (d - 7.2) * 1.5);
    for (const o of cars) {
      if (o === c || o.axis !== c.axis || o.dir !== c.dir || o.p !== c.p) continue;
      const gap = (o.pos - c.pos) * c.dir;
      if (gap > 0 && gap < 10) target = Math.min(target, (gap - 5.5) * 1.5);
    }
    c.speed += (Math.max(0, target) - c.speed) * (1 - Math.exp(-dt * 3));
    c.pos += c.dir * c.speed * dt;
    if (c.pos * c.dir > 185) c.pos = -185 * c.dir;
    if (c.axis === 'x') { c.g.position.set(c.pos, 0, c.p - 2.5 * c.dir); c.g.rotation.y = c.dir > 0 ? Math.PI / 2 : -Math.PI / 2; }
    else { c.g.position.set(c.p + 2.5 * c.dir, 0, c.pos); c.g.rotation.y = c.dir > 0 ? 0 : Math.PI; }
  }
  if (lampLights.length && (lampTick++ % 8 === 0)) {
    const near = lamps.map(l => ({ l, d: (l.x - player.x) ** 2 + (l.z - player.z) ** 2 })).sort((a, b) => a.d - b.d).slice(0, 4);

// Mixamo মডেল লোড (models/boy.glb, models/girl.glb, models/idle.glb, walk.glb, run.glb)
async function buildCharacter(gender) {
  const gltf = await loadAsset(gender);
  if (!gltf) return makePrimitive(gender);

  const model = gltf;
  model.rotation.y = MODEL_YAW;
  let box = new THREE.Box3().setFromObject(model);
  const s = CHAR_HEIGHT / (box.max.y - box.min.y);
  model.scale.setScalar(s);
  box = new THREE.Box3().setFromObject(model);
  model.position.y -= box.min.y;
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });

  const group = new THREE.Group();
  group.add(model);

  const mixer = new THREE.AnimationMixer(model);
  const actions = {}, speed = {};
  const normBone = nm => String(nm).replace(/^mixamorig\d*[:_]?/i, '').replace(/[^a-z0-9]/gi, '').toLowerCase();
  const boneMap = new Map();
  model.traverse(o => { if (o.isBone || o.type === 'Bone') boneMap.set(normBone(o.name), o.name); });
  const KEEP_Y = ['crouchidle', 'crouchwalk', 'prone'];      // এগুলোতে নিতম্বের উচ্চতা রাখতে হবে (নইলে শূন্যে ভাসবে)
  const ONCE = { jump: 0.75, punch: 0.9, kick: 1.1 };        // একবার চলবে, সর্বোচ্চ এত সেকেন্ডে শেষ হবে (ক্লিপ ছোট হলে নিজের স্বাভাবিক সময়ে)
  const dur = {};
  for (const [n, f] of Object.entries(ANIMS)) {
    const a = await loadAsset(f);
    if (!(a && a.animations.length)) continue;
    const clip = a.animations[0];
    // হাড়ের নাম মেলানো: অ্যানিমেশন ফাইলের হাড়ের নাম (mixamorig:, mixamorig1:, বা প্রিফিক্স ছাড়া) মডেলের হাড়ের নামে বদলে নেয়
    // নাম না মিললে ক্লিপ কোনো হাড়েই লাগে না, আর চরিত্র হাত মেলে (T-pose) দাঁড়িয়ে থাকে
    clip.tracks = clip.tracks.map(t => {
      const dot = t.name.lastIndexOf('.');
      if (dot < 0) return null;
      const bone = boneMap.get(normBone(t.name.slice(0, dot)));
      if (!bone) return null;
      t.name = bone + t.name.slice(dot);
      return t;
    }).filter(Boolean);
    if (!clip.tracks.length) { console.warn('অ্যানিমেশন "' + f + '" এর হাড়ের নাম মডেলের সাথে মেলেনি, বাদ দেওয়া হলো'); continue; }
    clip.tracks = clip.tracks.filter(t => {
      if (!t.name.endsWith('.position')) return true;
      if (KEEP_Y.includes(n) && /Hips\.position$/.test(t.name)) {   // শুধু উচ্চতা (Y) রাখো, সামনে-পিছনে সরা বন্ধ
        const v = t.values, x0 = v[0], z0 = v[2];
        for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i + 2] = z0; }
        return true;
      }
      return false;
    });
    const act = mixer.clipAction(clip, model);
    if (ONCE[n]) { const d = Math.min(clip.duration, ONCE[n]); act.setLoop(THREE.LoopOnce, 1); act.clampWhenFinished = true; speed[n] = clip.duration / d; dur[n] = d; }
    actions[n] = act;
  }
  if (!actions.idle && !actions.walk && !actions.run) { console.warn('অ্যানিমেশন ফাইল পাওয়া যায়নি, ব্যাকআপ চরিত্র ব্যবহার হচ্ছে'); return makePrimitive(gender); }
  // বন্দুক: ডান হাতের হাড়ে জোড়া
  let gun = null;
  let hand = model.getObjectByName('mixamorigRightHand');
  if (!hand) model.traverse(o => { if (!hand && /RightHand$/.test(o.name)) hand = o; });
  if (hand) {
    const k = 1 / s, mat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, metalness: 0.6, roughness: 0.4 });
    gun = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.07 * k, 0.75 * k, 0.1 * k), mat); body.position.y = 0.25 * k;
    const grip = new THREE.Mesh(new THREE.BoxGeometry(0.06 * k, 0.1 * k, 0.16 * k), mat); grip.position.set(0, -0.05 * k, -0.08 * k);
    gun.add(body, grip);
    gun.position.set(GUN_POS[0] * k, GUN_POS[1] * k, GUN_POS[2] * k);
    gun.rotation.set(...GUN_ROT);

  }
  console.log('লোড হওয়া অ্যানিমেশন:', Object.keys(actions).join(', '));
  for (const k of Object.keys(ANIMS)) if (!actions[k]) console.warn('অ্যানিমেশন লোড হয়নি:', k);
  return { group, mixer, actions, speed, dur, gun, current: null, state: null, key: null };
}

// মডেল না পেলে সাধারণ চরিত্র (ব্যাকআপ)

  const add = (geo, mat, x, y, z) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z); m.castShadow = true; g.add(m); return m;
  };
  add(new THREE.BoxGeometry(0.6, 0.7, 0.35), shirt, 0, 1.25, 0);
  add(new THREE.SphereGeometry(0.25, 16, 12), skin, 0, 1.9, 0);
  add(new THREE.SphereGeometry(0.27, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), hair, 0, 1.93, 0);
  if (!isBoy) add(new THREE.BoxGeometry(0.42, 0.55, 0.15), hair, 0, 1.7, -0.15);
  const limb = (x, y, geo, mat, h) => {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, 0);
    const m = new THREE.Mesh(geo, mat);
    m.position.y = -h / 2; m.castShadow = true;
    pivot.add(m); g.add(pivot);
    return pivot;
  };
  const legL = limb(-0.15, 0.9, new THREE.BoxGeometry(0.22, 0.9, 0.22), pants, 0.9);
  const legR = limb(0.15, 0.9, new THREE.BoxGeometry(0.22, 0.9, 0.22), pants, 0.9);
  const armL = limb(-0.42, 1.5, new THREE.BoxGeometry(0.18, 0.6, 0.18), shirt, 0.6);
  const armR = limb(0.42, 1.5, new THREE.BoxGeometry(0.18, 0.6, 0.18), shirt, 0.6);

  gun.position.set(0, -0.72, 0.02); gun.visible = false; armR.add(gun);
  return { group: g, legL, legR, armL, armR, gun, mixer: null, actions: {}, current: null, state: null };
}

let ac = null;
function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  // পরিবেশের শব্দের প্লেসহোল্ডার (পরে আসল সাউন্ড ফাইল দিয়ে বদলাবেন)
  const len = ac.sampleRate * 2;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
  const src = ac.createBufferSource();
  src.buffer = buf; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400;
  const g = ac.createGain(); g.gain.value = 0.04;
  src.connect(f).connect(g).connect(ac.destination);
  src.start();
}
function playStep(run) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle';
  o.frequency.value = (run ? 140 : 110) + Math.random() * 30;
  const t = ac.currentTime;
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + 0.09);
}

const joy = document.getElementById('joy'), knob = document.getElementById('knob');

function moveJoy(e) {
  const sc = joy.getBoundingClientRect().width / 120 || 1, max = 45 * sc;
  const dx = e.clientX - jcx, dy = e.clientY - jcy;
  const d = Math.hypot(dx, dy), k = d > max ? max / d : 1;
  const kx = dx * k, ky = dy * k;
  knob.style.left = (35 + kx / sc) + 'px';
  knob.style.top = (35 + ky / sc) + 'px';
  const DZ = 0.15;
  const rawX = kx / max, rawY = -ky / max, m = Math.hypot(rawX, rawY);
  if (m < DZ) { jx = 0; jy = 0; }
  else { const sc = (m - DZ) / (1 - DZ) / m; jx = rawX * sc; jy = rawY * sc; }
}

// ---------- প্লেয়ার ----------
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
const player = { x: 0, y: 0, z: 20, yaw: 0 };
let stance = 'stand', jumping = false, vy = 0, cr = 0, pr = 0;
let char = null, started = false;
let phase = 0, amp = 0, lastStep = 0;
let spd = 0;
let hp = 100, armor = 100, pDead = false, deadT = 0, hurtT = 99, deaths = 0, activeProfile = null;

function blocked(x, z) {
  for (const b of boxes) {
    if (x > b.minX - PR && x < b.maxX + PR && z > b.minZ - PR && z < b.maxZ + PR) return true;
  }
  return false;
}

function update(dt) {
  const kbX = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  const kbY = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  let ix = Math.max(-1, Math.min(1, kbX + jx));
  let iy = Math.max(-1, Math.min(1, kbY + jy));
  if (pDead) { ix = 0; iy = 0; }
  const run = (runTouch || keys.has('ShiftLeft') || keys.has('ShiftRight')) && stance === 'stand' && combatT <= 0 && !pDead;
  if (run && Math.hypot(ix, iy) < 0.1) { ix = 0; iy = 1; }   // দৌড় চালু থাকলে জয়স্টিক ছাড়াই সামনে দৌড়ায়
  const mag = Math.min(1, Math.hypot(ix, iy));
  const moving = mag > 0.1;

  const tSpeed = moving ? (run ? RUN : stance === 'crouch' ? WALK * 0.5 : stance === 'prone' ? WALK * 0.25 : WALK) * mag * (combatT > 0 ? 0.7 : 1) : 0;
  spd += (tSpeed - spd) * (1 - Math.exp(-dt * (tSpeed > spd ? 4 : 9)));
  if (moving) {
    const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
    const rx = -Math.cos(camYaw), rz = Math.sin(camYaw);
    let dx = fx * iy + rx * ix, dz = fz * iy + rz * ix;
    const len = Math.hypot(dx, dz) || 1;
    dx /= len; dz /= len;

    if (combatT <= 0) player.yaw += wrap(Math.atan2(dx, dz) - player.yaw) * (1 - Math.exp(-dt * 12));

    const speed = spd;
    const nx = player.x + dx * speed * dt;
    const nz = player.z + dz * speed * dt;
    if (!blocked(nx, player.z)) player.x = nx;
    if (!blocked(player.x, nz)) player.z = nz;
    player.x = Math.max(-180, Math.min(180, player.x));
    player.z = Math.max(-180, Math.min(180, player.z));

    phase += dt * (run ? 12 : 7) * mag;
  }

  if (!dragId && moving && iy > 0.3 && combatT <= 0) {
    camYaw += wrap(player.yaw - camYaw) * (1 - Math.exp(-dt * 1.5));
  }

  updateCombat(dt);
  updateVitals(dt);
  if (combatT > 0) {
    const tg = aimNPC(35, 25);
    const fy = tg ? Math.atan2(tg.g.position.x - player.x, tg.g.position.z - player.z) : camYaw;
    player.yaw += wrap(fy - player.yaw) * (1 - Math.exp(-dt * 14));
  }
  // ক্যারেক্টার
  if (char) {
    const gnd = groundY(player.x, player.z);
    if (jumping) {
      vy -= 20 * dt; player.y += vy * dt;
      if (player.y <= gnd && vy <= 0) { player.y = gnd; vy = 0; jumping = false; }
    } else player.y += (gnd - player.y) * (1 - Math.exp(-dt * 20));
    cr += ((stance === 'crouch' ? 1 : 0) - cr) * (1 - Math.exp(-dt * 12));
    pr += ((stance === 'prone' ? 1 : 0) - pr) * (1 - Math.exp(-dt * 10));
    char.group.rotation.order = 'YXZ';

      if (char.gun) char.gun.visible = gunT > 0 && stance === 'stand';

  const stepIdx = Math.floor(phase / Math.PI);

  // ক্যামেরা: yaw = ৩৬০° ঘোরা, pitch = আকাশ/নিচ দেখা (সোয়াইপ)

// রাস্তার গ্রিড ধরে পথ (৯×৯ মোড়, ডাইক্সট্রা)
const nid = (i, j) => (i + 4) * 9 + (j + 4);
const cl160 = v => Math.max(-160, Math.min(160, v));
function snapRoad(x, z) {
  const vi = Math.max(-4, Math.min(4, Math.round(x / 40))), hj = Math.max(-4, Math.min(4, Math.round(z / 40)));

    ? { x: vi * 40, z: cl160(z), axis: 'v', k: vi, t: cl160(z) }

}
function planRoute(P, M) {

  const adj = Array.from({ length: 83 }, () => []);
  const link = (a, b, w) => { adj[a].push([b, w]); adj[b].push([a, w]); };
  for (let i = -4; i <= 4; i++) for (let j = -4; j <= 4; j++) {
    if (i < 4) link(nid(i, j), nid(i + 1, j), 40);
    if (j < 4) link(nid(i, j), nid(i, j + 1), 40);
  }
  const attach = (n, pt) => {
    const a = Math.max(-4, Math.min(4, Math.floor(pt.t / 40))), b = Math.min(4, a + 1);
    const idOf = q => pt.axis === 'v' ? nid(pt.k, q) : nid(q, pt.k);

    if (b !== a) link(n, idOf(b), Math.abs(pt.t - b * 40));

  dist[S0] = 0;
  for (let it = 0; it < 83; it++) {
    let u = -1;
    for (let v = 0; v < 83; v++) if (!done[v] && (u < 0 || dist[v] < dist[u])) u = v;
    if (u < 0 || dist[u] === Infinity) break;
    done[u] = true;
    for (const [v, w] of adj[u]) if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; }
  }
  const ids = []; for (let v = E0; v !== -1; v = prev[v]) ids.unshift(v);
  const pts = [{ x: P.x, z: P.z }];

    if (id === S0) pts.push({ x: s.x, z: s.z });
    else if (id === E0) pts.push({ x: e.x, z: e.z });
    else pts.push({ x: (Math.floor(id / 9) - 4) * 40, z: (id % 9 - 4) * 40 });

}

  pDead = false; hp = 100; armor = 100; player.x = 0; player.z = 20; player.y = 0; stance = 'stand'; jumping = false;
  document.getElementById('dead').style.display = 'none'; saveProgress();
}
let lastBars = '';
function updateVitals(dt) {
  hurtT += dt;
  if (!pDead) { if (hp < 100 && hurtT > 8) hp = Math.min(100, hp + 2 * dt); }   // ৮ সেকেন্ড মার না খেলে ধীরে ধীরে সেরে ওঠে
  else {
    deadT += dt; fireHeld = false; fireCD = 1; atkCD = 1; atk = null; gunT = 0; combatT = 0;
    if (deadT > 3.5) respawnPlayer();
  }
  const tm = performance.now() / 1000;
  for (const pk of pickups) {
    if (pk.t > 0) { pk.t -= dt; if (pk.t <= 0) pk.g.visible = true; continue; }
    pk.g.rotation.y += dt * 2; pk.g.position.y = 0.9 + Math.sin(tm * 2 + pk.x) * 0.12;
    if (!pDead && Math.hypot(pk.x - player.x, pk.z - player.z) < 1.4) {
      if (pk.type === 'med') hp = Math.min(100, hp + 50); else armor = Math.min(100, armor + 50);
      pk.g.visible = false; pk.t = 40; sfx('kick');
    }
  }
  const b = Math.round(hp) + '/' + Math.round(armor);
  if (b !== lastBars) {
    lastBars = b;
    document.getElementById('hpf').style.width = Math.max(0, hp) + '%';
    document.getElementById('arf').style.width = Math.max(0, armor) + '%';
  }
}

// ---------- পোশাক ও ভেস্ট ----------
function makeVest(k) {
  const g = new THREE.Group(), m = new THREE.MeshStandardMaterial({ color: 0x3d4f3a, roughness: 0.8 }), m2 = new THREE.MeshStandardMaterial({ color: 0x2b3528, roughness: 0.9 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.4 * k, 0.4 * k, 0.3 * k), m); body.position.y = 0.05 * k; g.add(body);
  for (const x of [-0.11, 0, 0.11]) for (const z of [1, -1]) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.09 * k, 0.1 * k, 0.05 * k), m2);
    p.position.set(x * k, -0.06 * k, z * 0.165 * k); g.add(p);
  }
  return g;
}
const VEST_POS = [0, 0.05, 0];   // ভেস্ট ঠিক জায়গায় না বসলে এই সংখ্যাগুলো বদলান (মিটার)
function applyOutfit(c, p) {
  const dress = new THREE.Color(p.dress || '#3498db');
  if (c.mixer) {
    const model = c.group.children[0], mats = [];
    model.traverse(o => {
      if (!o.isMesh) return;
      o.material = Array.isArray(o.material) ? o.material.map(m => m.clone()) : o.material.clone();
      for (const m of (Array.isArray(o.material) ? o.material : [o.material])) mats.push([m, o.name]);
    });
    const skin = /skin|head|face|hair|eye|teeth|tongue|brow|lash|beard/i, cloth = /shirt|top|tee|jacket|cloth|outfit|dress|pant|jean|trouser|shoe|boot|hoodie|body/i;
    let n = 0;
    for (const [m, on] of mats) { const nm = (m.name || '') + ' ' + on; if (m.color && cloth.test(nm) && !skin.test(nm)) { m.color.lerp(dress, 0.55); n++; } }
    if (!n) for (const [m] of mats) if (m.color) m.color.lerp(dress, 0.2);
    let spine = model.getObjectByName('mixamorigSpine2');
    if (!spine) model.traverse(o => { if (!spine && /Spine2$/.test(o.name)) spine = o; });
    if (spine) {
      const k = 1 / model.scale.x, v = makeVest(k);
      v.position.set(VEST_POS[0] * k, VEST_POS[1] * k, VEST_POS[2] * k);
      spine.add(v); c.vest = v;
    }
  } else {
    c.group.children[0].material.color.set(dress);
    const v = makeVest(1); v.scale.set(1.6, 1.2, 1.25); v.position.set(0, 1.3, 0);
    c.group.add(v); c.vest = v;
  }
}

// ---------- প্রোফাইল (প্রত্যেকের আলাদা: নাম, পোশাক, কিল/মৃত্যু/সময়, অবস্থান, বাটন সাজানো) ----------
const MAX_PROFILES = 1, PKEY = 'orcb_profiles';
const DRESS = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#ecf0f1'];
let profiles = [], pgender = 'boy', pdress = DRESS[1], playStart = 0, playBase = 0, delArm = false;
try { const j = JSON.parse(localStorage.getItem(PKEY) || 'null'); if (j && Array.isArray(j.slots)) profiles = j.slots; } catch (e) {}
while (profiles.length < MAX_PROFILES) profiles.push(null);
function saveProfiles() { try { localStorage.setItem(PKEY, JSON.stringify({ slots: profiles })); } catch (e) {} }
function saveProgress() {
  if (!activeProfile || !started) return;
  Object.assign(activeProfile, { kills, deaths, hp, armor, x: player.x, z: player.z, playSec: playBase + (performance.now() - playStart) / 1000 });
  saveProfiles();
}
setInterval(saveProgress, 5000);
addEventListener('pagehide', saveProgress);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(); });
function fmtTime(sec) { const m = Math.floor(sec / 60); return m < 60 ? m + ' মি' : Math.floor(m / 60) + ' ঘ ' + (m % 60) + ' মি'; }
function renderProfile() {
  const box = document.getElementById('pcard'); box.innerHTML = ''; delArm = false;
  const mk = (tag, txt, cls) => { const e = document.createElement(tag); if (txt) e.textContent = txt; if (cls) e.className = cls; return e; };
  const p = profiles[0];
  if (p) {
    const card = mk('div', '', 'slot');
    card.append(mk('div', (p.gender === 'girl' ? '👧 ' : '👦 ') + p.name), mk('div', '💥 কিল: ' + (p.kills || 0) + ' · ☠ মৃত্যু: ' + (p.deaths || 0) + ' · ⏱ ' + fmtTime(p.playSec || 0)));
    const go = mk('button', '▶ খেলা শুরু'); go.onclick = () => startGame(p);
    const del = mk('button', '🗑 প্রোফাইল মুছুন'); del.style.background = '#c0392b';
    del.onclick = () => {
      if (!delArm) { delArm = true; del.textContent = 'আবার চাপুন — সব অগ্রগতি মুছে যাবে'; return; }
      profiles[0] = null; saveProfiles(); renderProfile();
    };
    box.append(card, go, del);
  } else {
    const inp = mk('input'); inp.id = 'pname_in'; inp.maxLength = 16; inp.placeholder = 'আপনার নাম';
    const gr = mk('div', '', 'row'), dr = mk('div', '', 'row');
    const gb = mk('button', '👦 ছেলে', 'opt'), gg = mk('button', '👧 মেয়ে', 'opt');
    const setG = g => { pgender = g; gb.classList.toggle('on', g === 'boy'); gg.classList.toggle('on', g === 'girl'); };
    gb.onclick = () => setG('boy'); gg.onclick = () => setG('girl'); setG(pgender);
    gr.append(gb, gg);
    const sws = DRESS.map(c => { const b = mk('button', '', 'sw'); b.style.background = c; b.onclick = () => { pdress = c; sws.forEach(x => x.classList.toggle('on', x === b)); }; if (c === pdress) b.classList.add('on'); return b; });
    dr.append(...sws);
    const go = mk('button', '✔ প্রোফাইল তৈরি করে শুরু');
    go.onclick = () => {
      const np = { id: Date.now(), name: (inp.value || '').trim() || 'খেলোয়াড়', gender: pgender, dress: pdress, created: Date.now(), kills: 0, deaths: 0, playSec: 0, hp: 100, armor: 100 };
      profiles[0] = np; saveProfiles(); startGame(np);
    };
    box.append(mk('div', 'নতুন প্রোফাইল তৈরি করুন', 'slot'), inp, gr, mk('div', 'পোশাকের রং', 'soon'), dr, go);
  }
  if (MAX_PROFILES < 2) box.append(mk('div', '➕ আরও প্রোফাইল — শীঘ্রই আসছে', 'slot soon'));
}

// ---------- ৩য় চোখ (পেছনের দৃশ্য, ঘোরানো যায়) ----------
const eyeEl = document.getElementById('eye'), eyeCam = new THREE.PerspectiveCamera(85, 1.6, 0.2, 400);
let eyeOn = false, eyeYaw = 0, eyePitch = 0, eyeDrag = null, eyeLX = 0, eyeLY = 0, eyeTap = 0;
eyeEl.addEventListener('pointerdown', e => {
  e.stopPropagation(); eyeDrag = e.pointerId; eyeEl.setPointerCapture(e.pointerId); eyeLX = e.clientX; eyeLY = e.clientY;
  const n = performance.now(); if (n - eyeTap < 350) { eyeYaw = 0; eyePitch = 0; } eyeTap = n;
});
eyeEl.addEventListener('pointermove', e => {
  if (e.pointerId !== eyeDrag) return;
  eyeYaw -= (e.clientX - eyeLX) * 0.012; eyePitch = Math.max(-1, Math.min(1.2, eyePitch + (eyeLY - e.clientY) * 0.008));
  eyeLX = e.clientX; eyeLY = e.clientY;
});
const eyeEnd = e => { if (e.pointerId === eyeDrag) eyeDrag = null; };
eyeEl.addEventListener('pointerup', eyeEnd); eyeEl.addEventListener('pointercancel', eyeEnd);
bindTap(document.getElementById('eyebtn'), () => {
  eyeOn = !eyeOn; eyeEl.style.display = eyeOn ? 'block' : 'none';
  document.getElementById('eyebtn').classList.toggle('on', eyeOn);
});
function renderEye() {
  if (!eyeOn || !started) return;
  const r = eyeEl.getBoundingClientRect(); if (r.width < 10) return;
  const yaw = camYaw + Math.PI + eyeYaw, cp = Math.cos(eyePitch);
  eyeCam.aspect = r.width / r.height; eyeCam.updateProjectionMatrix();
  eyeCam.position.set(player.x + Math.sin(yaw) * 0.55, player.y + 2.2 - cr * 0.5 - pr * 1.1, player.z + Math.cos(yaw) * 0.55);
  eyeCam.lookAt(eyeCam.position.x + Math.sin(yaw) * cp, eyeCam.position.y + Math.sin(eyePitch), eyeCam.position.z + Math.cos(yaw) * cp);
  const y0 = innerHeight - r.bottom;
  renderer.setScissorTest(true); renderer.setViewport(r.left, y0, r.width, r.height); renderer.setScissor(r.left, y0, r.width, r.height);
  renderer.shadowMap.autoUpdate = false; renderer.render(scene, eyeCam); renderer.shadowMap.autoUpdate = true;
  renderer.setScissorTest(false); renderer.setViewport(0, 0, innerWidth, innerHeight);
}

// ---------- বাটন কাস্টমাইজ (টেনে সরানো, সাইজ, স্বচ্ছতা, সেভ) ----------
const CUST = ['joy', 'run', 'jump', 'crouch', 'prone', 'punch', 'kick', 'fire', 'eyebtn', 'mini', 'eye', 'bars'];
const CNAME = { joy: 'জয়স্টিক', run: 'দৌড়', jump: 'লাফ', crouch: 'বসুন', prone: 'শুয়ুন', punch: 'ঘুসি', kick: 'লাথি', fire: 'ফায়ার', eyebtn: '৩য় চোখ বাটন', mini: 'মিনি ম্যাপ', eye: '৩য় চোখের জানালা', bars: 'হেলথ বার' };
const OPAQ = ['joy', 'run', 'jump', 'crouch', 'prone', 'punch', 'kick', 'fire', 'eyebtn'];
let layout = { op: 1 }, editMode = false, selId = null, dragP = null, dragOff = [0, 0];
try { const j = localStorage.getItem('wt_layout'); if (j) layout = Object.assign({ op: 1 }, JSON.parse(j)); } catch (e) {}
CUST.forEach(id => { document.getElementById(id).dataset.cust = id; });
function placeEl(id) {
  const el = document.getElementById(id), L = layout[id]; if (!L) return;
  el.style.left = (L.x * innerWidth) + 'px'; el.style.top = (L.y * innerHeight) + 'px';
  el.style.right = 'auto'; el.style.bottom = 'auto';
  el.style.transform = `translate(-50%,-50%) scale(${L.s || 1})`;
}
function applyLayout() {
  CUST.forEach(placeEl);
  for (const id of OPAQ) document.getElementById(id).style.opacity = layout.op || 1;
}
function ensureLayout(id) {
  if (layout[id]) return layout[id];
  const r = document.getElementById(id).getBoundingClientRect();
  return (layout[id] = { x: (r.left + r.width / 2) / innerWidth, y: (r.top + r.height / 2) / innerHeight, s: 1 });
}
function selectEl(id) {
  selId = id;
  CUST.forEach(i => document.getElementById(i).classList.toggle('sel', i === id));
  const L = ensureLayout(id);
  document.getElementById('szr').value = L.s || 1;
  document.getElementById('edtxt').textContent = 'বাছাই: ' + CNAME[id] + ' · টেনে সরান, সাইজ বদলান';
}
function saveLayout() { if (activeProfile) { activeProfile.layout = layout; saveProfiles(); return; } try { localStorage.setItem('wt_layout', JSON.stringify(layout)); } catch (e) {} }
function toggleEdit() {
  editMode = !editMode;
  const bar = document.getElementById('editbar');
  document.body.classList.toggle('editing', editMode);
  bar.style.display = editMode ? 'flex' : 'none';
  if (editMode) {
    jx = 0; jy = 0; fireHeld = false; selId = null; dragP = null;
    document.getElementById('eye').style.display = 'block';
    document.getElementById('opr').value = layout.op || 1;
    document.getElementById('edtxt').textContent = 'টেনে সরান · ট্যাপ করে বাছুন';
  } else {
    document.getElementById('eye').style.display = eyeOn ? 'block' : 'none';
    CUST.forEach(i => document.getElementById(i).classList.remove('sel'));
    saveLayout();
  }
}
bindTap(document.getElementById('gear'), toggleEdit);
document.getElementById('edsave').addEventListener('click', () => { if (editMode) toggleEdit(); });
document.getElementById('edflip').addEventListener('click', () => document.getElementById('editbar').classList.toggle('bottom'));
document.getElementById('edreset').addEventListener('click', () => {
  layout = { op: 1 };
  CUST.forEach(id => { const st = document.getElementById(id).style; st.left = st.top = st.right = st.bottom = st.transform = st.opacity = ''; });
  document.getElementById('opr').value = 1; document.getElementById('szr').value = 1; selId = null;
  CUST.forEach(i => document.getElementById(i).classList.remove('sel'));
  try { localStorage.removeItem('wt_layout'); } catch (e) {}
  if (activeProfile) { delete activeProfile.layout; saveProfiles(); }
});
document.getElementById('szr').addEventListener('input', e => {
  if (!selId) return; ensureLayout(selId).s = +e.target.value; placeEl(selId);
});
document.getElementById('opr').addEventListener('input', e => { layout.op = +e.target.value; applyLayout(); });
const inBar = e => e.target.closest && e.target.closest('#editbar,#gear');
addEventListener('pointerdown', e => {
  if (!editMode || inBar(e)) return;
  e.preventDefault(); e.stopPropagation();
  const el = e.target.closest('[data-cust]'); if (!el) return;
  selectEl(el.id);
  const r = el.getBoundingClientRect();
  dragP = e.pointerId; dragOff = [e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)];
}, { capture: true, passive: false });
addEventListener('pointermove', e => {
  if (!editMode || e.pointerId !== dragP || !selId) return;
  e.stopPropagation();
  const L = layout[selId];
  L.x = Math.max(0.03, Math.min(0.97, (e.clientX - dragOff[0]) / innerWidth));
  L.y = Math.max(0.03, Math.min(0.97, (e.clientY - dragOff[1]) / innerHeight));
  placeEl(selId);
}, true);
for (const ev of ['pointerup', 'pointercancel']) addEventListener(ev, e => {
  if (!editMode || inBar(e)) return;
  if (e.pointerId === dragP) dragP = null;
  e.stopPropagation();
}, true);
for (const ev of ['touchstart', 'touchend', 'mousedown', 'mouseup', 'click']) addEventListener(ev, e => {
  if (!editMode || inBar(e)) return;
  e.preventDefault(); e.stopPropagation();
}, { capture: true, passive: false });
addEventListener('resize', applyLayout);
applyLayout();

// ---------- লুপ (৩০ FPS সীমা) ----------
let last = performance.now(), fpsFrames = 0, fpsTime = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const el = now - last;
  if (el < 33) return;
  last = now - (el % 33);
  const dt = Math.min(el / 1000, 0.05);

  animateWorld(now / 1000, dt);
  if (started && !mapOpen && !editMode) update(dt);
  renderer.render(scene, camera);
  renderEye();
  if (started) { updateRoute(now); drawMini(); if (mapOpen) drawBig(); }

  fpsFrames++; fpsTime += el;
  if (fpsTime >= 1000) {
    document.getElementById('fps').textContent = 'FPS: ' + fpsFrames;
    fpsFrames = 0; fpsTime = 0;
  }
}

// ---------- শুরু ----------
buildWorld();
camera.position.set(player.x, 3, player.z - 6);
camera.lookAt(player.x, 1.6, player.z);
requestAnimationFrame(loop);

async function startGame(p) {
  activeProfile = p;
  document.querySelectorAll('#start button').forEach(b => b.disabled = true);
  document.getElementById('msg').textContent = 'লোড হচ্ছে...';
  if (!ac) initAudio();
  if (ac.state === 'suspended') ac.resume();

  try { char = await buildCharacter(p.gender); applyOutfit(char, p); }
  catch (e) { document.getElementById('msg').textContent = 'ত্রুটি হয়েছে, আবার চেষ্টা করুন'; document.querySelectorAll('#start button').forEach(b => b.disabled = false); return; }
  scene.add(char.group);
  if (typeof p.x === 'number') { player.x = p.x; player.z = p.z; if (blocked(player.x, player.z)) player.x = Math.round(player.x / SPACING) * SPACING; }
  kills = p.kills || 0; deaths = p.deaths || 0; hp = p.hp > 0 ? p.hp : 100; armor = p.armor == null ? 100 : p.armor;
  if (p.layout) { layout = Object.assign({ op: 1 }, p.layout); applyLayout(); }
  camYaw = 0; player.yaw = 0;
  started = true; playBase = p.playSec || 0; playStart = performance.now();

  document.getElementById('start').style.display = 'none';
  document.body.classList.add('playing');
  document.getElementById('hud').style.display = 'block';
  document.getElementById('mini').style.display = 'block';
  document.getElementById('joy').style.display = 'block';
  document.getElementById('run').style.display = 'block';
  document.getElementById('bars').style.display = 'block';
  document.getElementById('pname').textContent = '👤 ' + p.name;
  document.querySelectorAll('.act').forEach(b => b.style.display = 'block');
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- শুরুর ক্রম: লোডিং → ইন্টারফেস → গল্প → চরিত্র ----------
const gid = id => document.getElementById(id);
const pause = ms => new Promise(r => setTimeout(r, ms));
function showScr(id) {
  document.querySelectorAll('.scr').forEach(e => e.style.display = 'none');
  gid(id).style.display = 'flex';
}
const STORY = [
  'এক সময় এই শহর ছিল নদীর তীরের ছোট একটি জনপদ।',
  'আজ সে বড় হয়েছে, কিন্তু তার রাস্তায় এখনো হারিয়ে যায় অনেক স্বপ্ন।',
  'তুমি এখানে এসেছ নিজের পথ খুঁজতে।',
  'এখন বেছে নাও, তুমি কে হবে।'
];
let storyIdx = 0, storyTimer = null, storyFull = '', storyBusy = false;
function finishLine() {
  clearInterval(storyTimer);
  gid('storytxt').textContent = storyFull;
  storyBusy = false;
  gid('storybtn').textContent = storyIdx >= STORY.length ? 'চরিত্র বাছাই' : 'পরবর্তী';
}
function nextLine() {
  if (storyIdx >= STORY.length) { showScr('start'); renderProfile(); return; }
  storyFull = STORY[storyIdx++];
  const el = gid('storytxt');
  el.textContent = '';
  storyBusy = true;
  gid('storybtn').textContent = 'থামান';
  let i = 0;
  clearInterval(storyTimer);
  storyTimer = setInterval(() => {
    el.textContent = storyFull.slice(0, ++i);
    if (i >= storyFull.length) finishLine();
  }, 45);
}
gid('storybtn').addEventListener('click', () => { if (storyBusy) finishLine(); else nextLine(); });

async function introSeq() {
  showScr('loading');
  const fill = gid('barfill');
  let p = 0;
  const pre = preloadAll(); let preFin = false; pre.then(() => { preFin = true; });
  await new Promise(res => {
    const t = setInterval(() => {
      const target = preFin ? 100 : Math.min(95, preDone / PRELOAD.length * 100);
      p = Math.min(target, p + 2 + Math.random() * 3);
      fill.style.width = p + '%';
      gid('pct').textContent = Math.floor(p) + '%';
      if (p >= 100) { clearInterval(t); res(); }
    }, 80);
  });
  await pause(400);
  showScr('intro');
  requestAnimationFrame(() => requestAnimationFrame(() => gid('intro').classList.add('go')));
  await pause(3200);
  if (profiles[0]) { showScr('start'); renderProfile(); return; }   // ফিরে আসা খেলোয়াড়: গল্প বাদ
  showScr('story');
  nextLine();
}
