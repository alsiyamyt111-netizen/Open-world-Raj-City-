name: Update pack manifest
on:
  push:
    branches: [main, master]
    paths: ['models/**', 'branding/**', 'generate-manifest.js', '.github/workflows/pack-manifest.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node generate-manifest.js
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pack-manifest.json
          git diff --staged --quiet || (git commit -m "update pack manifest" && git push)
          
